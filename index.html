<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Daily Fate Wheel</title>
<style>
:root{--cream:#f7f0dd;--ink:#173636;--teal:#1f4e4e;--gold:#c9a227;--red:#a63d2f;--green:#2f6b3c;--paper:#fffdf5;--muted:#6b6255;--line:#cabf9e;--shadow:0 8px 24px #17363624}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:Arial,Helvetica,sans-serif;min-height:100vh}header{text-align:center;background:var(--teal);color:var(--cream);padding:18px 16px 22px;border-bottom:8px solid var(--gold);position:relative;overflow:hidden}header:before,header:after{content:"";position:absolute;top:14px;width:92px;height:42px;border-top:3px solid var(--gold);border-bottom:3px solid var(--gold)}header:before{left:5%;transform:skewX(-35deg)}header:after{right:5%;transform:skewX(35deg)}h1{font-size:clamp(2rem,5vw,4rem);text-transform:uppercase;letter-spacing:.12em;margin:0;font-weight:900;text-shadow:3px 3px 0 #112b2b}header p{font-size:clamp(1rem,2vw,1.3rem);margin:8px 0 0;color:#f4e6ba;font-weight:700}.app{max-width:1500px;margin:auto;padding:22px;display:grid;grid-template-columns:minmax(430px,1.3fr) minmax(330px,.7fr);gap:24px}.stage{display:flex;flex-direction:column;align-items:center}.wheel-wrap{position:relative;width:min(76vw,690px);aspect-ratio:1;padding:22px}.wheel-wrap:before{content:"";position:absolute;inset:7px;border:5px double var(--gold);border-radius:50%;pointer-events:none}.pointer{position:absolute;z-index:4;top:-2px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:25px solid transparent;border-right:25px solid transparent;border-top:56px solid var(--red);filter:drop-shadow(0 4px 1px #0004)}canvas{display:block;width:100%;height:100%;filter:drop-shadow(0 8px 7px #17363640)}.controls{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:12px;margin-top:6px}.btn{border:0;border-radius:8px;padding:12px 18px;font-weight:900;font-size:1rem;cursor:pointer;color:white;background:var(--teal);box-shadow:0 4px 0 #112e2e;transition:.12s}.btn:hover{filter:brightness(1.1);transform:translateY(-1px)}.btn:active{transform:translateY(2px);box-shadow:0 2px 0 #112e2e}.btn:disabled{opacity:.55;cursor:not-allowed;transform:none}.spin{font-size:clamp(1.5rem,3vw,2.2rem);padding:15px 38px;background:var(--red);box-shadow:0 5px 0 #66241b;letter-spacing:.12em}.secondary{color:var(--ink);background:#eadfbd;box-shadow:0 4px 0 #b8a97c}.danger{background:var(--red);box-shadow:0 4px 0 #66241b}.mute{min-width:132px}.result{width:min(94%,720px);min-height:102px;margin:20px 0 4px;padding:16px 22px;border:5px solid var(--teal);background:var(--paper);box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;border-radius:8px}.result-label{font-size:clamp(1.25rem,2.6vw,2rem);font-weight:900}.result-amount{font-size:clamp(1.8rem,4vw,3rem);font-weight:900;margin-top:2px}.gain{border-color:var(--green);color:var(--green)}.loss{border-color:var(--red);color:var(--red)}.neutral{border-color:#747474;color:#555}
.side{display:flex;flex-direction:column;gap:18px}.card{background:var(--paper);border:2px solid var(--line);box-shadow:var(--shadow);padding:18px;border-radius:8px}.card h2{font-size:1.35rem;text-transform:uppercase;letter-spacing:.07em;margin:0 0 14px;padding-bottom:8px;border-bottom:4px double var(--gold)}label{font-weight:800;display:block;margin-bottom:6px}input{width:100%;border:2px solid #a89d7c;border-radius:5px;padding:11px;font:inherit;background:#fff}input:focus,button:focus{outline:3px solid #5a9dad;outline-offset:2px}.household-row{display:grid;grid-template-columns:1fr;gap:8px}.totals{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.total-chip{background:#e9dfc0;border-left:6px solid var(--gold);padding:8px 10px;font-weight:800;border-radius:4px}.history-head{display:flex;justify-content:space-between;align-items:center;gap:10px}.history{list-style:none;margin:0;padding:0;max-height:300px;overflow:auto}.history li{display:grid;grid-template-columns:1fr auto;gap:10px;padding:10px 4px;border-bottom:1px solid #ddd0aa}.history small{display:block;color:var(--muted);margin-top:3px}.money{font-size:1.1rem;font-weight:900}.empty{color:var(--muted);font-style:italic;padding:12px 0}.edit-toggle{width:100%}.editor{display:none}.editor.open{display:block}.entry-list{display:flex;flex-direction:column;gap:9px;max-height:460px;overflow:auto;margin:10px 0}.entry{display:grid;grid-template-columns:1fr 94px 43px;gap:7px;align-items:center}.entry input{padding:8px}.icon-btn{height:42px;border:0;border-radius:5px;background:var(--red);color:#fff;font-size:1.25rem;font-weight:900;cursor:pointer}.add-row{display:grid;grid-template-columns:1fr 94px auto;gap:7px;padding-top:12px;border-top:2px solid var(--line)}.editor-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.help{font-size:.88rem;color:var(--muted);line-height:1.35;margin:8px 0 0}.save-note{font-weight:700;color:var(--green);min-height:1.2em;margin-top:9px}.noscript{margin:24px;padding:20px;background:#fff;border:3px solid var(--red);font-weight:800}@media(max-width:960px){.app{grid-template-columns:1fr}.wheel-wrap{width:min(90vw,650px)}.side{width:min(100%,760px);margin:auto}}@media(max-width:520px){.app{padding:12px}.wheel-wrap{padding:16px;width:96vw}.pointer{border-left-width:18px;border-right-width:18px;border-top-width:43px}.card{padding:14px}.entry,.add-row{grid-template-columns:1fr 80px 41px}.add-row .btn{grid-column:1/-1}.result{width:100%}}@media(prefers-reduced-motion:reduce){.btn{transition:none}}
</style>
</head>
<body>
<header><h1>The Daily Fate Wheel</h1><p>1920s Household Simulation — spin once per household each day</p></header>
<noscript><div class="noscript">JavaScript must be enabled to spin and edit this wheel.</div></noscript>
<main class="app">
<section class="stage" aria-label="Fate wheel">
<div class="wheel-wrap"><div class="pointer" aria-hidden="true"></div><canvas id="wheel" width="900" height="900" aria-label="A wheel of possible household events"></canvas></div>
<div class="controls"><button class="btn spin" id="spin">SPIN</button><button class="btn secondary mute" id="mute" aria-pressed="false">🔊 Sound on</button></div>
<div id="result" class="result neutral" role="status" aria-live="polite"><div class="result-label">Ready for today’s fate?</div><div class="result-amount">—</div></div>
</section>
<aside class="side">
<section class="card"><h2>Household</h2><div class="household-row"><label for="household">Household name <span style="font-weight:400">(optional)</span></label><input id="household" maxlength="60" placeholder="e.g., The Johnson Family" autocomplete="off"></div><div class="totals" id="totals"></div></section>
<section class="card"><div class="history-head"><h2 style="flex:1">Spin History</h2><button id="clearHistory" class="btn danger">Clear</button></div><ol class="history" id="history"></ol></section>
<section class="card"><button id="editToggle" class="btn secondary edit-toggle" aria-expanded="false">✎ Edit wheel</button><div id="editor" class="editor"><h2 style="margin-top:18px">Wheel Entries</h2><div id="entryList" class="entry-list"></div><div class="add-row"><input id="newLabel" placeholder="New event label" aria-label="New event label"><input id="newAmount" type="number" step="1" value="0" aria-label="New event amount"><button id="addEntry" class="btn">Add</button></div><div class="editor-actions"><button id="resetDefaults" class="btn danger">Reset to defaults</button></div><div id="saveNote" class="save-note" aria-live="polite"></div><p class="help">Changes save automatically on this device. If browser storage is unavailable, they remain available until this tab closes.</p></div></section>
</aside>
</main>
<script>
'use strict';
const DEFAULTS=[
{label:'Baby born! Doctor & supplies',amount:-15},{label:'Emergency hospital visit',amount:-20},{label:'Child needs medicine',amount:-8},{label:'Gambled and lost',amount:-10},{label:'Car broke down — repairs',amount:-12},{label:'Factory cut your hours',amount:-10},{label:'Roof sprung a leak',amount:-10},{label:'Lost wallet on the way home',amount:-5},{label:'Coal bill due early',amount:-6},{label:'Birthday money in the mail!',amount:10},{label:'Overtime shift at the factory',amount:10},{label:'Sold vegetables from the garden',amount:5},{label:'Found money on the street',amount:5},{label:'Neighbor repaid your loan',amount:7},{label:'Bonus for good work',amount:8},{label:'Sold old furniture',amount:6},{label:'A quiet day — nothing happens',amount:0},{label:'Church social — collection plate',amount:-2}
];
const COLORS=['#f7f0dd','#1f4e4e','#c9a227','#a63d2f'];
const store={memory:{},get(key,fallback){try{const raw=localStorage.getItem(key);if(raw!==null)return JSON.parse(raw)}catch(e){}return Object.prototype.hasOwnProperty.call(this.memory,key)?this.memory[key]:fallback},set(key,value){this.memory[key]=value;try{localStorage.setItem(key,JSON.stringify(value));return true}catch(e){return false}}};
let entries=sanitizeEntries(store.get('fateWheelEntries',DEFAULTS));
let history=sanitizeHistory(store.get('fateWheelHistory',[]));
let muted=!!store.get('fateWheelMuted',false);
let rotation=0,spinning=false,audioCtx=null,jazzTimer=null,jazzNodes=[],nextTickBoundary=-1;
const $=id=>document.getElementById(id),canvas=$('wheel'),ctx=canvas.getContext('2d');
const els={spin:$('spin'),mute:$('mute'),result:$('result'),household:$('household'),totals:$('totals'),history:$('history'),editor:$('editor'),editToggle:$('editToggle'),entryList:$('entryList'),newLabel:$('newLabel'),newAmount:$('newAmount'),saveNote:$('saveNote')};
function sanitizeEntries(value){if(!Array.isArray(value))return structuredCloneSafe(DEFAULTS);const clean=value.filter(x=>x&&typeof x.label==='string'&&x.label.trim()&&Number.isFinite(Number(x.amount))).map(x=>({label:x.label.trim().slice(0,100),amount:Math.round(Number(x.amount))}));return clean.length?clean:structuredCloneSafe(DEFAULTS)}
function sanitizeHistory(value){if(!Array.isArray(value))return[];return value.slice(0,200).filter(x=>x&&typeof x.label==='string'&&Number.isFinite(Number(x.amount))).map(x=>({household:String(x.household||'Unnamed household').slice(0,60),label:x.label.slice(0,100),amount:Math.round(Number(x.amount)),time:Number(x.time)||Date.now()}))}
function structuredCloneSafe(value){return JSON.parse(JSON.stringify(value))}
function money(n){if(n>0)return'+$'+n;if(n<0)return'−$'+Math.abs(n);return'$0'}
function segmentTextColor(color){return color==='#1f4e4e'||color==='#a63d2f'?'#fffdf5':'#173636'}
function wrapText(text,maxChars){const words=text.split(/\s+/),lines=[];let line='';for(const w of words){const test=line?line+' '+w:w;if(test.length>maxChars&&line){lines.push(line);line=w}else line=test}if(line)lines.push(line);return lines.slice(0,3)}
function drawWheel(){const W=canvas.width,H=canvas.height,cx=W/2,cy=H/2,r=410,n=entries.length,slice=Math.PI*2/n;ctx.clearRect(0,0,W,H);ctx.save();ctx.translate(cx,cy);ctx.rotate(rotation);for(let i=0;i<n;i++){const start=i*slice-Math.PI/2,end=start+slice,color=COLORS[i%COLORS.length];ctx.beginPath();ctx.moveTo(0,0);ctx.arc(0,0,r,start,end);ctx.closePath();ctx.fillStyle=color;ctx.fill();ctx.strokeStyle='#173636';ctx.lineWidth=4;ctx.stroke();const mid=start+slice/2;ctx.save();ctx.rotate(mid);ctx.translate(r*.6,0);const flip=Math.cos(mid)<0;ctx.rotate(flip?Math.PI:0);ctx.fillStyle=segmentTextColor(color);ctx.textAlign='center';ctx.textBaseline='middle';const small=n>18||entries[i].label.length>32;ctx.font=`900 ${small?18:21}px Arial`;const lines=wrapText(entries[i].label,small?21:18);const lh=small?20:23,offset=-(lines.length-1)*lh/2-10;lines.forEach((line,j)=>ctx.fillText(line,0,offset+j*lh,225));ctx.font='900 25px Arial';ctx.fillText(money(entries[i].amount),0,offset+lines.length*lh+8);ctx.restore()}ctx.beginPath();ctx.arc(0,0,70,0,Math.PI*2);ctx.fillStyle='#173636';ctx.fill();ctx.strokeStyle='#c9a227';ctx.lineWidth=10;ctx.stroke();ctx.fillStyle='#f7f0dd';ctx.font='900 24px Arial';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('FATE',0,0);ctx.restore()}
function renderEntries(){els.entryList.innerHTML='';entries.forEach((entry,i)=>{const row=document.createElement('div');row.className='entry';const label=document.createElement('input');label.value=entry.label;label.setAttribute('aria-label',`Entry ${i+1} label`);const amount=document.createElement('input');amount.type='number';amount.step='1';amount.value=entry.amount;amount.setAttribute('aria-label',`Entry ${i+1} amount`);const del=document.createElement('button');del.className='icon-btn';del.textContent='×';del.title='Delete entry';del.setAttribute('aria-label',`Delete ${entry.label}`);label.addEventListener('change',()=>updateEntry(i,label.value,amount.value));amount.addEventListener('change',()=>updateEntry(i,label.value,amount.value));del.addEventListener('click',()=>{if(entries.length<=2){note('Keep at least two wheel entries.');return}entries.splice(i,1);saveEntries();renderEntries();drawWheel()});row.append(label,amount,del);els.entryList.appendChild(row)})}
function updateEntry(i,label,amount){label=label.trim();amount=Number(amount);if(!label||!Number.isFinite(amount)){note('Each entry needs a label and a dollar amount.');renderEntries();return}entries[i]={label:label.slice(0,100),amount:Math.round(amount)};saveEntries();drawWheel()}
function saveEntries(){const persisted=store.set('fateWheelEntries',entries);note(persisted?'Saved.':'Saved for this tab; browser storage is unavailable.')}
let noteTimer;function note(msg){els.saveNote.textContent=msg;clearTimeout(noteTimer);noteTimer=setTimeout(()=>els.saveNote.textContent='',2800)}
let audioOut=null,jazzMaster=null,nextBeatTime=0,beatIndex=0;
function ensureAudio(){const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return false;if(!audioCtx){audioCtx=new AC();audioOut=audioCtx.createGain();audioOut.gain.value=muted?0:1;audioOut.connect(audioCtx.destination)}if(audioCtx.state==='suspended')audioCtx.resume();return true}
function midi(n){return 440*Math.pow(2,(n-69)/12)}
function track(node){jazzNodes.push(node);node.addEventListener&&node.addEventListener('ended',()=>{jazzNodes=jazzNodes.filter(x=>x!==node)},{once:true})}
function tone(freq,start,dur,volume,type='sine',dest=jazzMaster){if(!audioCtx||!dest)return;const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type=type;o.frequency.setValueAtTime(freq,start);g.gain.setValueAtTime(.0001,start);g.gain.exponentialRampToValueAtTime(volume,start+.012);g.gain.exponentialRampToValueAtTime(.0001,start+dur);o.connect(g);g.connect(dest);o.start(start);o.stop(start+dur+.03);track(o)}
function hat(start,volume=.025){if(!audioCtx||!jazzMaster)return;const frames=Math.max(1,Math.floor(audioCtx.sampleRate*.055)),buf=audioCtx.createBuffer(1,frames,audioCtx.sampleRate),data=buf.getChannelData(0);for(let i=0;i<frames;i++)data[i]=(Math.random()*2-1)*(1-i/frames);const src=audioCtx.createBufferSource(),filter=audioCtx.createBiquadFilter(),g=audioCtx.createGain();src.buffer=buf;filter.type='highpass';filter.frequency.value=5200;g.gain.setValueAtTime(volume,start);g.gain.exponentialRampToValueAtTime(.0001,start+.055);src.connect(filter);filter.connect(g);g.connect(jazzMaster);src.start(start);track(src)}
const bassCycle=[38,45,41,47,36,43,45,40];
const chords=[[62,65,69,72],[67,71,74,77],[60,64,67,71],[57,60,64,67]];
function scheduleBeat(t,i){const beat=.5;hat(t,.028);hat(t+beat*.66,.017);tone(midi(bassCycle[i%bassCycle.length]),t,.34,.055,'triangle');if(i%4===0){const chord=chords[(i/4)%chords.length|0];chord.forEach((m,k)=>tone(midi(m),t+.04+k*.006,.22,.009,'triangle'))}}
function jazzScheduler(){if(!audioCtx||!jazzMaster)return;while(nextBeatTime<audioCtx.currentTime+.45){scheduleBeat(nextBeatTime,beatIndex++);nextBeatTime+=.5}}
function startJazz(){if(!ensureAudio()||muted)return;stopJazz(true);jazzMaster=audioCtx.createGain();jazzMaster.gain.setValueAtTime(.0001,audioCtx.currentTime);jazzMaster.gain.exponentialRampToValueAtTime(.32,audioCtx.currentTime+.08);jazzMaster.connect(audioOut);nextBeatTime=audioCtx.currentTime+.02;beatIndex=0;jazzScheduler();jazzTimer=setInterval(jazzScheduler,90)}
function stopJazz(immediate=false){if(jazzTimer){clearInterval(jazzTimer);jazzTimer=null}if(jazzMaster&&audioCtx){const old=jazzMaster,t=audioCtx.currentTime;old.gain.cancelScheduledValues(t);old.gain.setValueAtTime(Math.max(old.gain.value,.0001),t);old.gain.exponentialRampToValueAtTime(.0001,t+(immediate?.015:.09));setTimeout(()=>{try{old.disconnect()}catch(e){}},150)}jazzMaster=null}
function tick(){if(muted||!ensureAudio())return;const o=audioCtx.createOscillator(),g=audioCtx.createGain(),t=audioCtx.currentTime;o.type='square';o.frequency.setValueAtTime(1450,t);g.gain.setValueAtTime(.018,t);g.gain.exponentialRampToValueAtTime(.0001,t+.018);o.connect(g);g.connect(audioOut);o.start(t);o.stop(t+.02)}
function showResult(entry){els.result.className='result '+(entry.amount>0?'gain':entry.amount<0?'loss':'neutral');els.result.querySelector('.result-label').textContent=entry.label;els.result.querySelector('.result-amount').textContent=money(entry.amount)}
function addHistory(entry){const household=els.household.value.trim()||'Unnamed household';history.unshift({household,label:entry.label,amount:entry.amount,time:Date.now()});history=history.slice(0,200);store.set('fateWheelHistory',history);renderHistory()}
function renderHistory(){els.history.innerHTML='';if(!history.length){const li=document.createElement('li');li.className='empty';li.textContent='No spins yet.';els.history.appendChild(li)}else history.forEach(item=>{const li=document.createElement('li'),left=document.createElement('div'),name=document.createElement('strong'),detail=document.createElement('small'),amt=document.createElement('span');name.textContent=item.household;detail.textContent=item.label;amt.className='money';amt.textContent=money(item.amount);amt.style.color=item.amount>0?'#2f6b3c':item.amount<0?'#a63d2f':'#555';left.append(name,detail);li.append(left,amt);els.history.appendChild(li)});const sums={};history.forEach(x=>sums[x.household]=(sums[x.household]||0)+x.amount);els.totals.innerHTML='';Object.entries(sums).forEach(([name,total])=>{const chip=document.createElement('div');chip.className='total-chip';chip.textContent=`${name}: ${money(total)}`;els.totals.appendChild(chip)})}
function spin(){if(spinning||entries.length<2)return;spinning=true;els.spin.disabled=true;els.editToggle.disabled=true;ensureAudio();startJazz();els.result.className='result neutral';els.result.querySelector('.result-label').textContent='Fate is turning…';els.result.querySelector('.result-amount').textContent='';const n=entries.length,slice=Math.PI*2/n,target=Math.floor(Math.random()*n),desired=(-target*slice-slice/2)%(Math.PI*2),currentMod=((rotation%(Math.PI*2))+Math.PI*2)%(Math.PI*2),desiredMod=((desired%(Math.PI*2))+Math.PI*2)%(Math.PI*2),delta=((desiredMod-currentMod+Math.PI*2)%(Math.PI*2))+(7+Math.floor(Math.random()*4))*Math.PI*2,startRot=rotation,start=performance.now(),duration=4000+Math.random()*2000;nextTickBoundary=Math.floor(rotation/slice);function frame(now){const p=Math.min(1,(now-start)/duration),ease=1-Math.pow(1-p,5);rotation=startRot+delta*ease;const boundary=Math.floor(rotation/slice);if(boundary!==nextTickBoundary){nextTickBoundary=boundary;tick()}drawWheel();if(p<1)requestAnimationFrame(frame);else{rotation=((rotation%(Math.PI*2))+Math.PI*2)%(Math.PI*2);stopJazz();spinning=false;els.spin.disabled=false;els.editToggle.disabled=false;const entry=entries[target];showResult(entry);addHistory(entry);drawWheel()}}requestAnimationFrame(frame)}
function updateMute(){els.mute.textContent=muted?'🔇 Sound off':'🔊 Sound on';els.mute.setAttribute('aria-pressed',String(muted));if(audioOut&&audioCtx)audioOut.gain.setTargetAtTime(muted?0:1,audioCtx.currentTime,.015);store.set('fateWheelMuted',muted);if(spinning){if(muted)stopJazz();else startJazz()}}
els.spin.addEventListener('click',spin);
els.mute.addEventListener('click',()=>{muted=!muted;ensureAudio();updateMute()});
els.editToggle.addEventListener('click',()=>{const open=els.editor.classList.toggle('open');els.editToggle.setAttribute('aria-expanded',String(open));els.editToggle.textContent=open?'✕ Close editor':'✎ Edit wheel';if(open)renderEntries()});
$('addEntry').addEventListener('click',()=>{const label=els.newLabel.value.trim(),amount=Number(els.newAmount.value);if(!label||!Number.isFinite(amount)){note('Enter a label and a dollar amount.');return}entries.push({label:label.slice(0,100),amount:Math.round(amount)});els.newLabel.value='';els.newAmount.value='0';saveEntries();renderEntries();drawWheel()});
els.newLabel.addEventListener('keydown',e=>{if(e.key==='Enter')$('addEntry').click()});
$('resetDefaults').addEventListener('click',()=>{if(!confirm('Restore all 18 default wheel entries?'))return;entries=structuredCloneSafe(DEFAULTS);saveEntries();renderEntries();drawWheel()});
$('clearHistory').addEventListener('click',()=>{if(!history.length||confirm('Clear all spin history and household totals?')){history=[];store.set('fateWheelHistory',history);renderHistory()}});
els.household.value=String(store.get('fateWheelHousehold',''));
els.household.addEventListener('input',()=>store.set('fateWheelHousehold',els.household.value.slice(0,60)));
window.addEventListener('resize',drawWheel);
drawWheel();renderHistory();updateMute();
</script>
</body>
</html>
